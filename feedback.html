<!DOCTYPE html>
<html>
    <head>  <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #a0e7f8;
        }
        header {
          
            background: #002b5b;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background: #014f86;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        section {
            padding: 40px;
            max-width: 900px;
            margin: auto;
            background: white;
            margin-top: 20px;
            border-radius: 10px;
        }
        h2 {
            color: #002b5b;
        }
        .logo {
            width: 120px;
            margin-bottom: 10px;
            float: right;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #002b5b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #014f86;
        }
        .img-box {
            text-align: center;
            margin: 20px 0;
        }
        .img-box img {
            width: 35%;
            border-radius: 10px;
        }
    </style></head>
    <body>
        <section id="feedback">
        <h2>Feedback & Gratitude</h2>
        <form>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Your Feedback</label>
                <textarea placeholder="Write your feedback here..."></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
           <footer><br>
            <br>

<p>&copy; 2025 Decent Work Awarness Page</p>

    </footer>

    </section>

        
    </body>
</html>
